<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitacora Las Luces</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --error: #e74c3c; }
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: var(--primary); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-blue { background: var(--accent); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-link { background: none; color: grey; cursor: pointer; }
        .hidden { display: none; }
        .msg { text-align: center; margin-top: 10px; font-size: 14px; font-weight: bold; }
        .msg.ok  { color: var(--success); }
        .msg.err { color: var(--error); }
    </style>
</head>
<body>
<div class="container">

    <div id="p1">
        <h2>Acceso</h2>
        <input type="email" id="correo" placeholder="Correo registrado">
        <button class="btn-blue" onclick="solicitar()">Enviar Codigo</button>
        <p class="msg" id="msg1"></p>
    </div>

    <div id="p2" class="hidden">
        <h2>Validar OTP</h2>
        <input type="text" id="otp" placeholder="Codigo de 6 digitos" maxlength="6">
        <button class="btn-green" onclick="validar()">Verificar</button>
        <button class="btn-link" onclick="location.reload()">Regresar</button>
        <p class="msg" id="msg2"></p>
    </div>

    <div id="p3" class="hidden">
        <h2>Registro de Visita</h2>
        <input type="text" id="nombre"   placeholder="Nombre Visitante">
        <input type="text" id="casa"     placeholder="Casa / Numero">
        <input type="text" id="visitado" placeholder="Residente que visita">
        <input type="date" id="fecha">
        <input type="time" id="hora">
        <input type="text" id="dui"      placeholder="DUI (########-#)">
        <button class="btn-green" onclick="registrar()">Guardar Registro</button>
        <p class="msg" id="msg3"></p>
    </div>

</div>

<script>
    const URL_APP = "https://script.google.com/macros/s/AKfycbw8y8EYNf88J1mCl2Qplryje_uFnuoGOEO4NbwfC-PBljVuVKc_WT7fKE6X6D6DcHSzDg/exec";

    function setMsg(id, texto, tipo) {
        var el = document.getElementById(id);
        el.textContent = texto;
        el.className = "msg " + tipo;
    }

    function callAPI(params, callback) {
        var cbName = "cb_" + Date.now();
        var script = document.createElement("script");

        params.callback = cbName;

        var qs = Object.keys(params).map(function(k) {
            return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]);
        }).join("&");

        window[cbName] = function(data) {
            delete window[cbName];
            document.body.removeChild(script);
            callback(null, data);
        };

        script.onerror = function() {
            delete window[cbName];
            document.body.removeChild(script);
            callback(new Error("Error de conexion"));
        };

        script.src = URL_APP + "?" + qs;
        document.body.appendChild(script);
    }

    function solicitar() {
        var email = document.getElementById("correo").value.trim();
        if (!email) return setMsg("msg1", "Ingresa un correo.", "err");

        setMsg("msg1", "Enviando codigo...", "ok");

        callAPI({ action: "requestOTP", email: email }, function(err, res) {
            if (err) return setMsg("msg1", "Error de conexion.", "err");
            if (res.status === "sent") {
                document.getElementById("p1").classList.add("hidden");
                document.getElementById("p2").classList.remove("hidden");
            } else {
                setMsg("msg1", "Correo no registrado.", "err");
            }
        });
    }

    function validar() {
        var email = document.getElementById("correo").value.trim();
        var otp   = document.getElementById("otp").value.trim();
        if (!otp) return setMsg("msg2", "Ingresa el codigo.", "err");

        setMsg("msg2", "Verificando...", "ok");

        callAPI({ action: "verifyOTP", email: email, otp: otp }, function(err, res) {
            if (err) return setMsg("msg2", "Error de conexion.", "err");
            if (res.status === "valid") {
                document.getElementById("p2").classList.add("hidden");
                document.getElementById("p3").classList.remove("hidden");
            } else {
                setMsg("msg2", "Codigo incorrecto o vencido.", "err");
            }
        });
    }

    function registrar() {
        var campos = ["nombre", "casa", "visitado", "fecha", "hora", "dui"];
        var d = { action: "saveVisit" };

        for (var i = 0; i < campos.length; i++) {
            var val = document.getElementById(campos[i]).value.trim();
            if (!val) return setMsg("msg3", "Completa todos los campos.", "err");
            d[campos[i]] = val;
        }

        setMsg("msg3", "Guardando...", "ok");

        callAPI(d, function(err, res) {
            if (err) return setMsg("msg3", "Error de conexion.", "err");
            if (res.status === "success") {
                setMsg("msg3", "Registro guardado con exito!", "ok");
                setTimeout(function() { location.reload(); }, 2000);
            } else {
                setMsg("msg3", "Error: " + (res.message || "intenta de nuevo."), "err");
            }
        });
    }
</script>
</body>
</html>
