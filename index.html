 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Las Luces</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --error: #e74c3c; }
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: var(--primary); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-blue { background: var(--accent); color: white; }
        .btn-green { background: var(--success); color: white; }
        .btn-link { background: none; color: grey; }
        .hidden { display: none; }
        .msg { text-align: center; margin-top: 10px; font-size: 14px; font-weight: bold; }
        .msg.ok  { color: var(--success); }
        .msg.err { color: var(--error); }
    </style>
</head>
<body>
<div class="container">

    <!-- Paso 1: Correo -->
    <div id="p1">
        <h2>Acceso</h2>
        <input type="email" id="correo" placeholder="Correo registrado">
        <button class="btn-blue" onclick="solicitar()">Enviar Código</button>
        <p class="msg" id="msg1"></p>
    </div>

    <!-- Paso 2: OTP -->
    <div id="p2" class="hidden">
        <h2>Validar OTP</h2>
        <input type="text" id="otp" placeholder="Código de 6 dígitos" maxlength="6">
        <button class="btn-green" onclick="validar()">Verificar</button>
        <button class="btn-link" onclick="location.reload()">Regresar</button>
        <p class="msg" id="msg2"></p>
    </div>

    <!-- Paso 3: Registro -->
    <div id="p3" class="hidden">
        <h2>Registro de Visita</h2>
        <input type="text" id="nombre"   placeholder="Nombre Visitante">
        <input type="text" id="casa"     placeholder="Casa / Número">
        <input type="text" id="visitado" placeholder="Residente que visita">
        <input type="date" id="fecha">
        <input type="time" id="hora">
        <input type="text" id="dui"      placeholder="DUI (########-#)">
        <button class="btn-green" onclick="registrar()">Guardar Registro</button>
        <p class="msg" id="msg3"></p>
    </div>

</div>

<script>
    const URL_APP = "https://script.google.com/macros/s/AKfycbwX4ChURyCEpru9NClxxXYJrKenmHj0ec3wGFogxmwqQ6xUVVJ92xkVKCWgUc4NSv-Zvg/exec";

    function setMsg(id, texto, tipo) {
        const el = document.getElementById(id);
        el.textContent = texto;
        el.className = "msg " + tipo;
    }

    async function solicitar() {
        const email = document.getElementById('correo').value.trim();
        if (!email) return setMsg('msg1', 'Ingresa un correo.', 'err');

        setMsg('msg1', 'Enviando código...', 'ok');
        try {
            const r = await fetch(URL_APP, {
                method: "POST",
                body: JSON.stringify({ action: "requestOTP", email })
            });
            const res = await r.json();
            if (res.status === "sent") {
                document.getElementById('p1').classList.add('hidden');
                document.getElementById('p2').classList.remove('hidden');
            } else {
                setMsg('msg1', 'Correo no registrado.', 'err');
            }
        } catch(e) {
            setMsg('msg1', 'Error de conexión. Verifica permisos del Script.', 'err');
        }
    }

        const email = document.getElementById('correo').value.trim();
